<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사 아카이브</title><link rel="stylesheet" href="style.css">
<script defer src="data.js"></script><script defer src="app.js"></script><script defer src="lookup.js"></script><script defer src="csv.js"></script>
</head>
<body>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">◎</span><div>강사 아카이브<small>기업 교육 · 외부 강연</small></div></div><div class="tools"><button id="csv-export">CSV 내보내기</button><button id="csv-import">CSV 가져오기</button><input id="csv-file" type="file" accept=".csv,text/csv" hidden><button id="backup">백업</button><button id="restore">불러오기</button><input id="upload" type="file" accept=".json,application/json" hidden></div></header>
<main>
<section class="intro"><div><p class="eyebrow">외부 강사 디렉터리</p><h1>강사 찾기</h1><p>우리 회사에 맞는 강사를 찾고 강의 이력과 평가를 관리하세요.</p></div><button class="primary" id="add">＋ 강사 등록</button></section>
<div class="layout">
<aside aria-label="강사 검색 및 목록">
<div class="filters"><label for="search">강사 검색</label><div class="searchbox"><input id="search" type="search" placeholder="이름, 소속, 강의 주제" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false"><div id="suggest" role="listbox" hidden></div></div>
<label for="category" class="sr">분야</label><select id="category"><option value="">모든 분야</option></select></div>
<div class="listhead"><strong id="count" aria-live="polite"></strong><span>가나다순</span></div><div id="list"></div>
</aside>
<article class="detail" id="detail" aria-label="강사 상세 정보"></article>
</div>
<footer><a href="db-history/index.html">공개 강사 DB 이전 버전</a> · 등록·수정한 자료와 평가는 현재 브라우저에 저장됩니다. 백업으로 파일을 보관할 수 있습니다.</footer>
</main>
<dialog id="dialog"><form id="editor"><header><h2 id="dialog-title"></h2><button id="close" type="button" aria-label="닫기">×</button></header><div id="fields"></div><p id="form-error" role="alert"></p><div class="form-actions"><button id="cancel" type="button">취소</button><button class="primary">저장</button></div></form></dialog>
<dialog id="lookup" aria-labelledby="lookup-title"><header class="lookup-head"><h2 id="lookup-title">강사 추가</h2><button type="button" id="lookup-close" aria-label="닫기">×</button></header>
<form id="lookup-form"><label>강사 이름<input id="lookup-name" required maxlength="60" placeholder="예: 김경일"></label><label>강의 주제 또는 소속 <small>(선택)</small><input id="lookup-topic" maxlength="120" placeholder="예: 인지심리학, 아주대학교"></label><button class="primary">웹에서 검색</button></form>
<div id="lookup-results" aria-live="polite"></div><div class="sectionhead lookup-actions"><button id="lookup-manual" type="button">직접 입력</button><button id="lookup-photo" type="button">사진으로 추가</button></div></dialog>
<div id="status" class="toast" role="status" hidden></div>
</body></html>
